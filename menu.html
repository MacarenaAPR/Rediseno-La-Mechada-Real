<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e7bbf">
    <title>Mechada Real - Sandwichería Valdivia</title>
    <meta name="description" content="Deliciosa carne mechada y sandwichería en Valdivia. Menú, reservas y ubicación.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="Menu.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Style+Script&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    
</head>

<body>
    <header class="header-carrusel-titulo">
        <nav>
            <button id="mobile-menu-btn">☰</button>
            <a href="index.html"><img src="/Recursos/LOGO.png" alt="logo" id="LOGO"></a>
            <div class="menu-dropdown">
                <a id="Reservas"href="Reserva.Html">Reservas</a>
                <a id="contactanos"href="#div_Recursos-Encuentranos">Contactanos</a> 
            </div>
            
            <div class="nav_redes">
                <P>Siguenos en nuestras redes</P>
                <a href="https://www.facebook.com/lamechadareal?locale=es_LA"><i class="bi bi-facebook"></i></a>
                <a href="https://www.instagram.com/lamechadareal"><i class="bi bi-instagram"></i></a></div>  
        </nav>
    </header>
    <Main id="menu">
        
        <div class="header-carrusel-titulo">    
            <div id="carouselExampleDark" class="carousel carousel-dark slide" data-bs-ride="carousel">
  
                <div class="carousel-indicators" id="carousel-indicators"></div>

                <div class="carousel-inner" id="carousel-inner"></div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>

            </div>
            <h1 id="menu-la-mechada-real">Menú La Mechada Real</h1>
        </div>
        <nav class="navbar navbar-dark bg-dark" id="navbar">
            <button class="btn-nav">Para Comer</button>
            <button class="btn-nav">Para Beber</button>
        </nav>    
        <!--WSP-->
        <a href="https://wa.me/56988424939" class="wsp-float" target="_blank" aria-label="WhatsApp">
        <i class="bi bi-whatsapp" id="wsp"></i>
        </a> 
    </Main>
    
    <footer>
        <p>Desarrollado por @ MPR.ING</p>
    </footer>

    <script>
        const btn = document.getElementById("mobile-menu-btn");
        const nav = document.querySelector("nav");

        btn.addEventListener("click", () => {
            nav.classList.toggle("open");
        });
    </script>
    <script>
        window.addEventListener("scroll", () => {
        const nav = document.querySelector("nav");

        if (window.innerWidth > 768) { // SOLO desktop
            if (window.scrollY > 20) {
            nav.classList.add("nav-lateral");
            nav.style.opacity = "1";
            nav.style.pointerEvents = "auto";
            } else {
            nav.classList.remove("nav-lateral");
            }
        }
        });
    </script>
    <script>
const slug = "la-mechada-real";
const apiUrl = `https://back-end-restaurantes.onrender.com/api/menu/${slug}/`;

const menuContainer = document.getElementById("menu");
const carouselInner = document.getElementById("carousel-inner");
const carouselIndicators = document.getElementById("carousel-indicators");
const imagenesCategorias = {
    "Desayunos": "/Recursos/recurso1.webp",
    "Mechadas": "/Recursos/recurso2.webp",
    "Churrasco y Completos": "/Recursos/recurso3.webp",
    "Para Compartir": "/Recursos/recurso4.webp",
    "Platos": "/Recursos/recurso5.webp",
    "Menu Infantil": "/Recursos/recurso6.webp",
};
fetch(apiUrl)
.then(response => response.json())
.then(data => {

    let slideIndex = 0;
    let hayPromociones = false;
    let contadorCategorias = 0;

    data.forEach(categoria => {
        
        const esPromocion = categoria.categoria.toLowerCase() === "promociones";

        // ============================
        // 🔥 PROMOCIONES → CARRUSEL
        // ============================
        if (esPromocion && categoria.productos.length > 0) {

            hayPromociones = true;

            categoria.productos.forEach(producto => {

                // Indicador
                const indicator = document.createElement("button");
                indicator.type = "button";
                indicator.setAttribute("data-bs-target", "#carouselExampleDark");
                indicator.setAttribute("data-bs-slide-to", slideIndex);

                if (slideIndex === 0) {
                    indicator.classList.add("active");
                }

                carouselIndicators.appendChild(indicator);

                // Slide
const slide = document.createElement("div");
slide.className = slideIndex === 0
    ? "carousel-item active"
    : "carousel-item";

// Contenedor personalizado
const promoContainer = document.createElement("div");
promoContainer.className = "promo-container";

// FOTO
const imgDiv = document.createElement("div");
imgDiv.className = "promo-img";

if (producto.imagen) {
    const img = document.createElement("img");
    img.src = "http://127.0.0.1:8000" + producto.imagen;
    img.alt = producto.nombre;
    imgDiv.appendChild(img);
}

// 🔥 Badge llamativo
const badge = document.createElement("div");
badge.className = "promo-badge";
badge.textContent = "PROMOCIÓN";

imgDiv.appendChild(badge);

// DETALLE
const detailDiv = document.createElement("div");
detailDiv.className = "promo-detail";

detailDiv.innerHTML = `
    <div class="promo-header">
        <h2>${producto.nombre}</h2>
        <div class="promo-price">$${producto.precio}</div>
    </div>

    <div class="promo-divider"></div>

    <p class="promo-description">
        ${producto.descripcion || ""}
    </p>
    <p class="promo-condiciones">
        ${producto.Condiciones || ""}
    </p>

    
`;
promoContainer.appendChild(imgDiv);
promoContainer.appendChild(detailDiv);

slide.appendChild(promoContainer);
carouselInner.appendChild(slide);

                slideIndex++;
            });
        }

        // ============================
        // 🍔 RESTO → SECTION POR CATEGORÍA
        // ============================
        
        else if (!esPromocion && categoria.productos.length > 0) {

            const section = document.createElement("section");
            section.className = "categoria-section";

            // CONTENEDOR FLEX
            const container = document.createElement("div");
            container.className = "categoria-flex";

            // 🔁 Alternar izquierda/derecha
            if (contadorCategorias % 2 !== 0) {
                container.style.flexDirection = "row-reverse";
            }

            // ======================
            // 📸 IMAGEN (solo una)
            // ======================
            const imagenDiv = document.createElement("div");
            imagenDiv.className = "categoria-imagen";

            const img = document.createElement("img");

            if (imagenesCategorias[categoria.categoria]) {
                img.src = imagenesCategorias[categoria.categoria];
            } else {
                img.src = "/Recursos/default.jpg";
            }
            img.alt = categoria.categoria;
            imagenDiv.appendChild(img);
            // ======================
            // 📋 LISTA PRODUCTOS
            // ======================
            const listaDiv = document.createElement("div");
            listaDiv.className = "categoria-lista";

            const titulo = document.createElement("h2");
            titulo.textContent = categoria.categoria;
            listaDiv.appendChild(titulo);

            categoria.productos.forEach(producto => {

                const item = document.createElement("div");
                item.className = "producto-item";

                item.innerHTML = `
                    <div>
                        <strong>${producto.nombre}</strong>
                        <p>${producto.descripcion || ""}</p>
                    </div>
                    <span>$${producto.precio}</span>
                `;

                listaDiv.appendChild(item);
            });

            container.appendChild(imagenDiv);
            container.appendChild(listaDiv);
            section.appendChild(container);
            menuContainer.appendChild(section);

            // 🔥 IMPORTANTE: incrementar contador
            contadorCategorias++;
        }

    });

    // Si no hay promociones → ocultar carrusel
    if (!hayPromociones) {
        document.getElementById("carouselExampleDark").style.display = "none";
    }

})
.catch(error => {
    console.error("Error cargando menú:", error);
});
</script>
</body>


</html>
